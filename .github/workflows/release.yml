# Publish a release of the CLI.
#
# There is nothing publisher-specific to embed: every user connects their own
# Google project and their own AI provider key, so a release is just a clean,
# verified build. The job still refuses to publish a package that contains a
# credential or local development state.
name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm after verification
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    name: Build and verify the package
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      - name: Re-run the full verification suite
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - run: pnpm build
      - name: Verify the package contains no credentials or local state
        run: pnpm verify:package
      - name: Software bill of materials
        run: pnpm sbom

      - name: Pack and checksum
        run: |
          npm pack --pack-destination dist-artifacts --ignore-scripts
          cd dist-artifacts && shasum -a 256 ./*.tgz | tee SHA256SUMS.txt

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist-artifacts/*.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifact
          path: |
            dist-artifacts/*.tgz
            dist-artifacts/SHA256SUMS.txt
            sbom.cdx.json

      # Publishing is a separate, explicitly requested step so a verified build
      # can be inspected before it becomes installable.
      - name: Publish to npm
        if: inputs.publish == true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --ignore-scripts dist-artifacts/*.tgz
