# Publish a release of the CLI.
#
# A release optionally embeds the publisher configuration that makes one-consent
# onboarding possible: the Desktop OAuth client, the setup page, the AI gateway,
# and the Firebase project. None of those values is confidential (see
# src/auth/publisher-client.ts), and a model-provider key is never among them.
#
# With the `release` environment's variables unset, this publishes a source-style
# build with no publisher behind it, which the CLI reports honestly. Either way
# the job refuses to publish a package containing a credential, a half-embedded
# configuration, or local development state.
name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm after verification
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    name: Build and verify the package
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir gateway install --no-frozen-lockfile --ignore-workspace

      - name: Re-run the full verification suite
        run: |
          pnpm lint
          pnpm typecheck
          pnpm gateway:typecheck
          pnpm test

      - run: pnpm build

      # Skipped when the publisher variables are unset, which produces a build
      # with no publisher configuration rather than a half-embedded one.
      - name: Embed publisher configuration
        if: vars.PUBLISHER_OAUTH_CLIENT_ID != ''
        env:
          GMAIL_AGENT_PUBLISHER_OAUTH_CLIENT_ID: ${{ vars.PUBLISHER_OAUTH_CLIENT_ID }}
          GMAIL_AGENT_PUBLISHER_OAUTH_CLIENT_SECRET: ${{ secrets.PUBLISHER_OAUTH_CLIENT_SECRET }}
          GMAIL_AGENT_PUBLISHER_SETUP_PAGE_URL: ${{ vars.PUBLISHER_SETUP_PAGE_URL }}
          GMAIL_AGENT_PUBLISHER_AI_GATEWAY_URL: ${{ vars.PUBLISHER_AI_GATEWAY_URL }}
          GMAIL_AGENT_PUBLISHER_FIREBASE_API_KEY: ${{ vars.PUBLISHER_FIREBASE_API_KEY }}
        run: pnpm embed:release

      # Only meaningful for a build that embeds a publisher, since the pages
      # disclose what that publisher's service does. A release without one is
      # not shipping those pages.
      - name: Verify the hosted setup and policy pages
        if: vars.PUBLISHER_OAUTH_CLIENT_ID != ''
        run: pnpm verify:hosting

      - name: Verify the package contains no credentials or local state
        run: pnpm verify:package
      - name: Software bill of materials
        run: pnpm sbom

      - name: Pack and checksum
        run: |
          npm pack --pack-destination dist-artifacts --ignore-scripts
          cd dist-artifacts && shasum -a 256 ./*.tgz | tee SHA256SUMS.txt

      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist-artifacts/*.tgz

      - uses: actions/upload-artifact@v5
        with:
          name: release-artifact
          path: |
            dist-artifacts/*.tgz
            dist-artifacts/SHA256SUMS.txt
            sbom.cdx.json

      # Publishing is a separate, explicitly requested step so a verified build
      # can be inspected before it becomes installable.
      - name: Publish to npm
        if: inputs.publish == true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --ignore-scripts dist-artifacts/*.tgz
